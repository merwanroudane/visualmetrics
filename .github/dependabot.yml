version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      scientific:
        patterns:
          - numpy
          - scipy
          - pandas
          - statsmodels
          - linearmodels
          - arch
          - scikit-learn
      tooling:
        patterns:
          - pytest*
          - ruff
          - mypy
          - pre-commit
          - build
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
