name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/visualmetrics/core src/visualmetrics/i18n src/visualmetrics/catalog

  honesty:
    name: scientific-honesty rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,viz]"

      # These are the rules the project exists to keep, so they get their own
      # job: a failure here should be unmistakable in the checks list.
      - name: Evidence labelling, animation explanations, planned concepts
        run: pytest tests/regression -q

      - name: Proof rules
        run: pytest tests/unit/test_proofs.py -q

      - name: Scientific identities
        run: pytest tests/scientific -q

  translations:
    name: trilingual bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Keys aligned across English, Arabic and French
        run: pytest tests/translations -q

  build:
    name: package builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/python -c "
          import visualmetrics as vm
          print(vm.__version__, len(vm.list_concepts()), 'concepts')
          "
          /tmp/wheeltest/bin/visualmetrics doctor
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
