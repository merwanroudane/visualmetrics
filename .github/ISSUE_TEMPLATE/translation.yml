name: Translation
description: A missing, wrong or awkward translation - or an offer to add some.
title: "[i18n] "
labels: ["translation", "good first issue"]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: ["Arabic", "French", "English", "A new language"]
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind?
      options:
        - Missing text (falls back to English)
        - Wrong or misleading translation
        - Awkward phrasing
        - Right-to-left layout problem
        - Terminology inconsistent with the glossary
        - Offering to translate a lab
    validations:
      required: true

  - type: input
    id: key
    attributes:
      label: Translation key or screen
      placeholder: labs.power.metric.size

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
