name: Bug report
description: Something crashed, rendered wrongly, or behaved unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where?
      options:
        - GUI
        - Python API
        - Notebook
        - CLI
        - Export
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence that shows it. Include the seed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Interface language
      placeholder: ar

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `visualmetrics doctor`.
      render: text
